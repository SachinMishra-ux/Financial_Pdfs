name: Financial RAG — Build & Deploy to AWS ECR / EC2

on:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

# ──────────────────────────────────────────────────────────────────────────────
# JOB 1 — Continuous Integration
#   • Runs on GitHub-hosted runner (ubuntu-latest)
#   • Authenticates with AWS / ECR
#   • Builds the generation-service Docker image
#   • Tags and pushes the image to ECR
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS Auth ─────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & push Generation Service image ────────────────────────────────
      - name: Build, tag, and push — Generation Service
        id: build-service
        env:
          ECR_REGISTRY:       ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO_NAME:      ${{ secrets.ECR_REPO_NAME }}
          IMAGE_TAG:          ${{ github.sha }}
        run: |
          docker build \
            -f Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPO_NAME:latest \
            .

          docker push $ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO_NAME:latest

          echo "service_image=$ECR_REGISTRY/$ECR_REPO_NAME:$IMAGE_TAG" >> $GITHUB_OUTPUT

# ──────────────────────────────────────────────────────────────────────────────
# JOB 2 — Continuous Deployment
#   Runs on a self-hosted runner (configured directly on your EC2 instance)
#   • Pulls the freshly-pushed image from ECR
#   • Deploys both Qdrant and the API Service via docker-compose
# ──────────────────────────────────────────────────────────────────────────────
  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: self-hosted

    steps:
      # ── AWS Auth ─────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Checkout (needed for docker-compose.yml) ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Write runtime secrets to .env ─────────────────────────────────────────
      - name: Write runtime .env from GitHub Secrets
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          AWS_REGION=${{ env.AWS_REGION }}
          SQS_QUEUE_URL=${{ secrets.SQS_QUEUE_URL }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF

      # ── Tear down existing stack ──────────────────────────────────────────────
      - name: Stop existing containers (if any)
        run: |
          docker compose down --remove-orphans || true

      # ── Pull latest image built by CI ─────────────────────────────────────────
      - name: Pull latest image from ECR
        env:
          ECR_REGISTRY:      ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO_NAME:     ${{ secrets.ECR_REPO_NAME }}
        run: |
          docker pull $ECR_REGISTRY/$ECR_REPO_NAME:latest

      # ── Deploy with docker compose ────────────────────────────────────────────
      - name: Deploy with docker compose
        env:
          ECR_REGISTRY:      ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO_NAME:     ${{ secrets.ECR_REPO_NAME }}
        run: |
          export GENERATION_SERVICE_IMAGE=$ECR_REGISTRY/$ECR_REPO_NAME:latest

          docker compose \
            -f docker-compose.yml \
            up -d --no-build

      # ── Health check ──────────────────────────────────────────────────────────
      - name: Wait and verify containers are running
        run: |
          sleep 10
          docker compose ps
          docker logs generation-api --tail 20 || true
